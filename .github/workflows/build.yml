name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configure Godot for Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME/debug.keystore" > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      - name: Import project and export APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/backrooms.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-apk
          path: build/backrooms.apk
